name: Sudoku Elite CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean install

    - name: Run Tests and Verify Quality Gate
      run: mvn -B test jacoco:report jacoco:check

    - name: Generate Javadoc
      run: mvn javadoc:javadoc

    - name: Upload JaCoCo Report
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: target/site/jacoco

    - name: Upload Javadoc
      uses: actions/upload-artifact@v3
      with:
        name: javadoc
        path: target/reports/apidocs

  deploy-docs:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3
      with:
        ref: gh-pages
    
    - name: Download Javadoc Artifact
      uses: actions/download-artifact@v3
      with:
        name: javadoc
        path: .
    
    - name: Commit and Push Javadoc to GitHub Pages
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add .
        git commit -m "docs: auto-generate javadoc [skip ci]" || echo "No changes to commit"
        git push origin gh-pages
