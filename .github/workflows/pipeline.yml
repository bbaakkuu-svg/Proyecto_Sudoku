name: "ðŸš€ CI/CD Industrial (RA2, RA3, RA4)"

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-gate:
    name: "QA & Documentation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CÃ³digo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas y Cobertura (RA3)
        run: mvn clean test jacoco:report

      - name: Generar Javadoc (RA4)
        run: mvn javadoc:javadoc

      - name: Preparar Artefactos para GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          mkdir -p public/coverage
          mkdir -p public/javadoc
          cp -r target/site/jacoco/* public/coverage/
          cp -r target/reports/apidocs/* public/javadoc/
          # Página de inicio Premium para el QA Dashboard
          cat <<EOF > public/index.html
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Sudoku Elite - QA Dashboard</title>
              <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
              <style>
                  body { font-family: 'Inter', sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
                  .container { background: #1e1e1e; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; }
                  h1 { color: #64b4ff; font-size: 2rem; margin-bottom: 1.5rem; }
                  .links { display: flex; gap: 1rem; justify-content: center; }
                  a { text-decoration: none; color: #121212; background: #64b4ff; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 700; transition: transform 0.2s, background 0.2s; }
                  a:hover { background: #4a90e2; transform: translateY(-2px); }
                  .footer { margin-top: 2rem; font-size: 0.8rem; color: #777; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🧩 Sudoku Elite: QA Dashboard</h1>
                  <p>Estado de Ingeniería y Calidad del Proyecto</p>
                  <div class="links">
                      <a href="./javadoc/">API Documentation</a>
                      <a href="./coverage/">Coverage Report</a>
                  </div>
                  <div class="footer">Generado automáticamente mediante GitHub Actions • Antigravity Sincronización</div>
              </div>
          </body>
          </html>
          EOF

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/configure-pages@v4

      - name: Subir Artefacto
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Desplegar a GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        id: deployment
        uses: actions/deploy-pages@v4
