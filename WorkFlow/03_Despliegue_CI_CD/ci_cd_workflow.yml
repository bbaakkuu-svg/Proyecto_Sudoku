name: "🚀 CI/CD Industrial (RA2, RA3, RA4)"

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality-gate:
    name: "QA & Documentation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar Pruebas y Cobertura (RA3)
        run: mvn clean test jacoco:report

      - name: Generar Javadoc (RA4)
        run: mvn javadoc:javadoc

      - name: Preparar Artefactos para GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          mkdir -p public/coverage
          mkdir -p public/javadoc
          cp -r target/site/jacoco/* public/coverage/
          cp -r target/reports/apidocs/* public/javadoc/
          # Página de inicio simple para navegar
          echo "<html><body><h1>Sudoku Elite - QA Dashboard</h1><ul><li><a href='./javadoc/'>API Javadoc</a></li><li><a href='./coverage/'>Coverage Report (JaCoCo)</a></li></ul></body></html>" > public/index.html

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/configure-pages@v4

      - name: Subir Artefacto
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Desplegar a GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        id: deployment
        uses: actions/deploy-pages@v4
